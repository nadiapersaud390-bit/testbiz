<div class="p-4 max-w-7xl mx-auto flex flex-col gap-6">

    <!-- Header & Controls -->
    <div class="bg-gradient-to-br from-indigo-500/20 to-purple-500/20 border-2 border-indigo-500/30 rounded-2xl p-5 shadow-[0_0_20px_rgba(99,102,241,0.15)] flex flex-col lg:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4 w-full lg:w-auto">
            <div class="text-4xl text-indigo-400"><i class="fas fa-list-check"></i></div>
            <div>
                <h2 id="tracker-title" class="text-2xl font-black bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent uppercase tracking-tight">My Lead Tracker</h2>
                <p id="tracker-subtitle" class="text-indigo-400/80 text-[10px] font-bold uppercase tracking-widest">Track your weekly leads</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center justify-end gap-3 w-full lg:w-auto">
            <div id="tracker-selected-agent-pill" class="hidden px-3 py-2 rounded-xl bg-cyan-500/10 border border-cyan-500/25 text-cyan-300 text-[10px] font-black uppercase tracking-wider"></div>
            <select id="tracker-week-select" class="min-w-[190px] bg-black/40 border border-white/10 rounded-xl p-2 text-white text-[11px] font-bold uppercase tracking-widest focus:border-indigo-500 outline-none transition" onchange="window.trackerSelectWeek()">
                <option value="">Loading Weeks...</option>
            </select>
            <button id="tracker-new-week-btn" class="bg-indigo-500/20 border border-indigo-500/50 text-indigo-300 px-4 py-2 rounded-xl text-[10px] font-bold uppercase hover:bg-indigo-500/30 transition shadow-[0_0_15px_rgba(99,102,241,0.2)]" onclick="window.trackerStartNewWeek()">
                <i class="fas fa-plus mr-1"></i> Start New Week
            </button>
            <button id="tracker-del-week-btn" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-2 rounded-xl text-[10px] font-bold uppercase hover:bg-red-500/20 transition" onclick="window.trackerDeleteWeek()">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </div>

    <!-- Main Content Grid -->
    <div class="flex flex-col lg:flex-row gap-6">

        <!-- Agent Add Lead Form -->
        <div id="tracker-agent-form-panel" class="w-full lg:w-1/3">
            <div class="bg-white/5 border border-white/10 rounded-2xl p-5 sticky top-4">
                <h3 class="text-white font-black uppercase text-sm mb-4 tracking-wider flex items-center justify-between">
                    <span>Add New Lead</span>
                    <i class="fas fa-user-plus text-indigo-400"></i>
                </h3>

                <div class="flex flex-col gap-3">
                    <div>
                        <label class="block text-[9px] font-black text-slate-500 uppercase tracking-widest ml-1 mb-1">First Name <span class="text-slate-600">(Optional)</span></label>
                        <input type="text" id="tl-fname" placeholder="John" class="w-full bg-black/40 border border-white/10 rounded-xl p-2 text-white text-sm focus:border-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-500 uppercase tracking-widest ml-1 mb-1">Last Name <span class="text-slate-600">(Optional)</span></label>
                        <input type="text" id="tl-lname" placeholder="Doe" class="w-full bg-black/40 border border-white/10 rounded-xl p-2 text-white text-sm focus:border-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-500 uppercase tracking-widest ml-1 mb-1">Phone Number <span class="text-indigo-400">(Required)</span></label>
                        <input type="tel" id="tl-phone" placeholder="(555) 555-5555" class="w-full bg-black/40 border border-white/10 rounded-xl p-2 text-white text-sm focus:border-indigo-500 outline-none transition">
                    </div>
                    <div class="flex items-center gap-2 mt-1">
                        <input type="checkbox" id="tl-good" class="w-4 h-4 rounded border-white/10 bg-black/40 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-gray-900 cursor-pointer">
                        <label for="tl-good" class="text-[11px] font-bold text-slate-300 uppercase tracking-wider cursor-pointer">Good Lead?</label>
                    </div>

                    <button id="tl-submit-btn" class="mt-2 w-full bg-indigo-500/20 border border-indigo-500/50 text-indigo-300 py-3 rounded-xl text-xs font-black uppercase hover:bg-indigo-500/30 transition shadow-[0_0_15px_rgba(99,102,241,0.2)] disabled:opacity-50" onclick="window.trackerAddLead()">
                        Add Lead
                    </button>
                    <div id="tl-error" class="text-red-400 text-[10px] font-bold text-center min-h-4 mt-1"></div>
                </div>
            </div>
        </div>

        <!-- Admin Agent Browser -->
        <div id="tracker-admin-panel" class="hidden w-full lg:w-1/3">
            <div class="bg-white/5 border border-white/10 rounded-2xl p-5 lg:sticky lg:top-4">
                <div class="flex items-center justify-between gap-3 mb-4">
                    <div>
                        <h3 class="text-white font-black uppercase text-sm tracking-wider">Agent Trackers</h3>
                        <p class="text-slate-500 text-[9px] font-bold uppercase tracking-widest mt-1">Click an agent to view their leads</p>
                    </div>
                    <i class="fas fa-users-viewfinder text-cyan-400 text-lg"></i>
                </div>

                <div class="relative mb-4">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-600 text-xs"></i>
                    <input id="tracker-agent-search" type="text" placeholder="Search agent name or ID..." oninput="window.trackerFilterAgents()" class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-9 pr-3 text-white text-xs focus:border-cyan-500 outline-none transition">
                </div>

                <div id="tracker-admin-summary" class="grid grid-cols-3 gap-2 mb-4">
                    <div class="rounded-xl border border-white/5 bg-black/20 p-2.5 text-center">
                        <div id="tracker-summary-agents" class="text-lg font-black text-white">0</div>
                        <div class="text-[8px] text-slate-500 font-black uppercase tracking-wider">Agents</div>
                    </div>
                    <div class="rounded-xl border border-white/5 bg-black/20 p-2.5 text-center">
                        <div id="tracker-summary-leads" class="text-lg font-black text-indigo-400">0</div>
                        <div class="text-[8px] text-slate-500 font-black uppercase tracking-wider">Leads</div>
                    </div>
                    <div class="rounded-xl border border-white/5 bg-black/20 p-2.5 text-center">
                        <div id="tracker-summary-good" class="text-lg font-black text-emerald-400">0</div>
                        <div class="text-[8px] text-slate-500 font-black uppercase tracking-wider">Good</div>
                    </div>
                </div>

                <div id="tracker-agent-list" class="flex flex-col gap-2 max-h-[58vh] overflow-y-auto pr-1 tracker-scrollbar">
                    <div class="text-center py-8 text-cyan-400 text-[10px] font-black uppercase tracking-widest"><i class="fas fa-spinner fa-spin mr-2"></i>Loading agents...</div>
                </div>
            </div>
        </div>

        <!-- Leads Display -->
        <div class="w-full lg:w-2/3">
            <div id="tracker-viewing-banner" class="hidden mb-4 rounded-2xl border border-cyan-500/20 bg-cyan-500/5 px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                    <div class="text-[9px] text-cyan-500 font-black uppercase tracking-widest">Viewing Agent Tracker</div>
                    <div id="tracker-viewing-name" class="text-white font-black uppercase text-sm mt-0.5"></div>
                </div>
                <div id="tracker-viewing-stats" class="text-[10px] text-slate-400 font-bold uppercase tracking-wider"></div>
            </div>

            <div id="tracker-days-container" class="flex flex-col gap-4">
                <div class="text-center p-10 text-slate-500 font-bold uppercase tracking-widest text-xs border border-white/5 rounded-2xl bg-white/5">
                    Select or Start a week to view leads.
                </div>
            </div>
        </div>

    </div>
</div>
